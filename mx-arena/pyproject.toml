[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mx-arena"
version = "0.1.0"
description = "Full Alpaca exchange simulator for MOMENTUM-X"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "msgpack>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
sweep = [
    "optuna>=3.6.0",
    "ray>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
