[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[project]
name = "momentum-x"
version = "0.1.0"
description = "AI-powered explosive momentum trading system using multi-agent debate"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Momentum-X Contributors" }]
keywords = ["trading", "algorithmic-trading", "llm", "multi-agent", "alpaca", "momentum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "websockets>=12.0,<14.0",
    "litellm>=1.40,<2.0",
    "python-dotenv>=1.0,<2.0",
    "anyio>=4.0,<5.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/pierce-lonergan/momentum-x"
Documentation = "https://github.com/pierce-lonergan/momentum-x#readme"
Repository = "https://github.com/pierce-lonergan/momentum-x"
Issues = "https://github.com/pierce-lonergan/momentum-x/issues"

[project.scripts]
momentum-x = "main:main"

# ── Tool Configuration ──────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: tests \u226530s (e.g. PyMC NUTS). Run with `pytest -m slow`; skip with `pytest -m 'not slow'`.",
]

[tool.hypothesis]
max_examples = 200

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Track A item 1 (2026-04-23): added BLE/S110/S112/DTZ/TRY per
# `25_bug_hunting_playbook.md` §7.8. These rules catch the
# silent-failure classes Bug N (bare except swallowing AttributeError)
# and Bug Q (silent fallback on missing key).
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF",  # baseline
    "BLE",     # blind except (catches Bug N's class)
    "S110",    # try-except-pass
    "S112",    # try-except-continue
    "DTZ",     # datetime tz-aware (catches naive UTC drift)
    "TRY",     # try/except antipatterns
    "PIE",     # misc gotchas
]
ignore = [
    "E501",    # line length
    "B008",    # call in default arg (Pydantic Field idiom)
    "TRY003",  # long exception messages — we want explicit context
    "TRY300",  # consider else block — too noisy for trading code
    "TRY301",  # raise inside try — sometimes the right pattern
    "TRY400",  # use logger.exception — logger.error+exc_info is also fine
    "TRY401",  # redundant exception in logger — varies by case
    "PIE790",  # unnecessary placeholder (pass) — sometimes intentional
]

[tool.ruff.lint.per-file-ignores]
# Tests can have bare excepts (failure tests intentionally swallow)
"tests/**" = ["BLE", "S110", "S112"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

# ── mypy: relaxed default + strict opt-in ────────────────────────
# Existing config was strict globally but never actually enforced.
# Track A item 1 phases this in: relax to allow gradual typing while
# new modules opt in to strict. Bug N (AttributeError on wrong client
# class) would have been caught by `mypy --strict` on the call site.
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_unreachable = true
no_implicit_optional = true
ignore_missing_imports = true   # phase 1: don't fail on third-party stub gaps

# Strict opt-in for the modules that ARE properly typed today
[[tool.mypy.overrides]]
module = [
    "src.execution.bar1_exit_logging",
    "src.monitoring.eod_recon",
    "src.execution.bridge",
]
strict = true
