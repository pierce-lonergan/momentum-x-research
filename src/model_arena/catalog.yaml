# Cross-model evaluation catalog for D220 Phase 7.
#
# Each entry: provider, api_model_id (litellm format), input_price_per_mtok USD,
# output_price_per_mtok USD, context_window, notes.
#
# IMPORTANT: model IDs marked `verified: true` were confirmed against
# src/llm_arena/harness.py MODEL_REGISTRY and are known to resolve through litellm.
# Entries marked `verified: false` are best-effort guesses based on the user's
# Phase 7 prompt and Together's published model IDs as of Apr 2026 — they may
# fail to resolve at API call time, in which case the harness logs and skips.
#
# To add a model: append an entry. To disable: set `enabled: false`.

models:

  # ── Anthropic (production-grade) ───────────────────────────────────────
  - key: claude-haiku-4-5
    enabled: true
    verified: true                              # in llm_arena MODEL_REGISTRY
    provider: anthropic
    api_model_id: anthropic/claude-haiku-4-5-20251001
    input_price_per_mtok: 0.25
    output_price_per_mtok: 1.25
    context_window: 200000
    notes: "Cheapest Anthropic; production candidate for fast agents."

